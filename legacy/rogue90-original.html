<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROGUE 90'</title>
<style>
:root{--bg:#0b0917;--p1:#17122b;--p2:#221a3d;--edge:#3b2f63;--edge2:#52427f;--amber:#e0a43a;--ochre:#c58a2b;--brick:#a8402f;--burg:#6b1f33;--steel:#8696ab;--leather:#7a4a2a;--txt:#e8dcc0;--dim:#8d85a3;--good:#7fae62;--bad:#c4473a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Courier New",Courier,monospace;font-weight:bold;font-size:12px;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit}
#app{display:grid;grid-template-rows:46px minmax(0,1fr) 118px;height:100vh;width:100vw}
#top{display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#2a2050,#171229);border-bottom:2px solid var(--edge2);overflow:hidden}
#logo{font-size:20px;letter-spacing:2px;color:var(--amber);text-shadow:2px 2px 0 var(--burg),3px 3px 0 #000;margin-right:6px;white-space:nowrap}
.chip{background:#0c0a18;border:2px solid var(--edge);padding:3px 7px;white-space:nowrap;font-size:12px}
.chip small{color:var(--dim);margin-right:5px;font-size:10px}
.chip b{color:var(--txt)}
#sCash{color:#e8c25a}
.grow{flex:1}
.btn{background:linear-gradient(#5a4a8c,#3b2f63);color:var(--txt);border:2px solid #0a0714;box-shadow:inset 1px 1px 0 #8a7bc4,inset -1px -1px 0 #2a2048;padding:4px 8px;cursor:pointer;text-transform:uppercase;font-size:11px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.25)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.amber{background:linear-gradient(#e0a43a,#a8742a);color:#1a1020;box-shadow:inset 1px 1px 0 #f4cc7a,inset -1px -1px 0 #7a4e1a}
.btn.red{background:linear-gradient(#b8453a,#7a2430);box-shadow:inset 1px 1px 0 #e0806a,inset -1px -1px 0 #4a1420}
.btn.on{outline:2px solid var(--amber)}
.btn.sm{padding:3px 5px;font-size:10px}
#mid{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
#arenaWrap{position:relative;background:#05040c;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0}
#cv{display:block;background:#0b0917}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#0c0a18ee;border:2px solid var(--amber);color:var(--amber);padding:5px 14px;font-size:14px;letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:5}
#toast.show{opacity:1}
#pauseTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;color:var(--amber);text-shadow:3px 3px 0 var(--burg),5px 5px 0 #000;display:none;pointer-events:none;letter-spacing:6px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05030baa;z-index:6;text-align:center}
#overlay .menu{display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px;max-width:92%}
.title{font-size:clamp(34px,7vw,72px);letter-spacing:4px;color:var(--amber);text-shadow:3px 3px 0 var(--burg),6px 6px 0 #0a0714;line-height:1}
.sub{color:var(--steel);letter-spacing:2px;font-size:13px}
.menu .btn{font-size:15px;padding:8px 22px;min-width:240px}
.hintbox{color:var(--dim);font-size:11px;max-width:620px;line-height:1.5}
#side{background:var(--p1);border-left:2px solid var(--edge2);padding:6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:var(--edge2) var(--p1)}
.sec{background:var(--p2);border:2px solid var(--edge);padding:5px;flex:none}
.sec h4{color:var(--amber);font-size:11px;letter-spacing:1px;margin-bottom:4px;display:flex;justify-content:space-between}
.row{display:flex;gap:4px;margin-top:4px}
#slotCv{width:100%;height:auto;display:block;background:#0a0814;border:2px solid #000}
#casMsg{font-size:10px;color:var(--steel);margin-top:3px;min-height:12px;line-height:1.2}
#inv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:1;background:#0c0a18;border:2px solid var(--edge);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot img{width:80%;height:80%}
.slot.sel{outline:2px solid var(--amber);background:#2a2040}
.slot .lv,.eq .lv{position:absolute;right:1px;bottom:0;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
.lv1{border-color:#8696ab}.lv2{border-color:#c58a2b}.lv3{border-color:#c4473a;box-shadow:0 0 6px #c4473a88}
#itemInfo{font-size:10px;color:var(--steel);margin-top:4px;min-height:24px;line-height:1.25}
#sel{font-size:11px}
.selhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.selhead i{color:var(--steel);font-style:normal;font-size:10px}
.hpb{position:relative;height:12px;background:#0c0a18;border:2px solid #000;margin:2px 0}
.hpb b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#8fc070,#5a8a46)}
.hpb span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:9px;color:#fff;text-shadow:1px 1px 0 #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 6px;font-size:10px;color:var(--dim);margin:3px 0}
.stats b{color:var(--txt)}
.eqrow{display:flex;gap:4px;margin:3px 0}
.eq{width:34px;height:34px;border:2px solid var(--edge);background:#0c0a18;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eq img{width:26px;height:26px}
.eq.empty{opacity:.55;color:var(--dim);font-size:8px}
#bottom{background:linear-gradient(#171229,#0e0b1c);border-top:2px solid var(--edge2);padding:5px 6px;overflow:hidden}
#cards{display:flex;gap:6px;height:100%}
.card{flex:1 1 0;min-width:150px;max-width:250px;display:flex;gap:6px;background:var(--p2);border:2px solid var(--edge);padding:4px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:var(--edge2)}
.card.sel{border-color:var(--amber);box-shadow:0 0 8px #e0a43a66}
.card.target{animation:pulse .7s infinite alternate}
.card.dead{opacity:.35}
@keyframes pulse{from{box-shadow:0 0 0 #e0a43a00}to{box-shadow:0 0 10px #e0a43acc}}
.card canvas{width:80px;height:88px;background:linear-gradient(#2e2450,#15112a);border:1px solid var(--edge);flex:none}
.ci{flex:1;min-width:0;font-size:10px;display:flex;flex-direction:column;gap:2px}
.ci .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .nm i{color:var(--steel);font-style:normal;font-size:9px}
.ci .eqs{display:flex;gap:2px}
.ci .eqs .e{width:20px;height:20px;border:1px solid var(--edge);background:#0c0a18;display:flex;align-items:center;justify-content:center;position:relative}
.ci .eqs .e img{width:16px;height:16px}
.ci .eqs .e.lv2{border-color:#c58a2b}.ci .eqs .e.lv3{border-color:#c4473a}.ci .eqs .e.lv1{border-color:#8696ab}
.ci .st{color:var(--dim);display:grid;grid-template-columns:1fr 1fr;gap:0 4px;font-size:9px}
.ci .st b{color:var(--txt)}
.ci .cm{color:var(--amber);font-size:9px}
.card.hire{flex:0 0 100px;min-width:100px;align-items:center;justify-content:center;text-align:center;color:var(--amber);font-size:13px;flex-direction:column;border-style:dashed}
.card.hire small{color:var(--dim);font-size:9px}
#modal{position:fixed;inset:0;background:#05030bd0;display:none;align-items:center;justify-content:center;z-index:50}
.box{background:var(--p1);border:3px solid var(--edge2);box-shadow:0 0 0 3px #000,0 10px 40px #000;padding:14px;max-width:min(960px,96vw);max-height:94vh;overflow:auto}
.box h2{color:var(--amber);letter-spacing:2px;margin-bottom:8px;font-size:18px;text-shadow:2px 2px 0 var(--burg)}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(220px,1fr))}
.tile{background:var(--p2);border:2px solid var(--edge);padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;font-size:11px}
.tile canvas,.tile img{background:linear-gradient(#2e2450,#15112a);border:1px solid var(--edge)}
.tile p{color:var(--steel);font-size:10px;line-height:1.3;min-height:26px}
.tile h3{color:var(--txt);font-size:13px}
.tile .nx{color:var(--amber)}
.pips{display:flex;gap:3px}.pips i{width:14px;height:8px;background:#0c0a18;border:1px solid var(--edge2)}.pips i.on{background:var(--amber)}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 20px;margin:8px 0;font-size:13px}
.res span:nth-child(odd){color:var(--steel)}
.res .tot{color:var(--amber);font-size:16px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
@media (max-height:720px){#bottom{padding:3px 6px}.card canvas{width:64px;height:70px}}
@media (max-width:1320px){#logo{font-size:15px}.btn{padding:4px 5px;font-size:10px}.chip{padding:3px 5px}}
@media (max-width:1180px){#chipT{display:none}#logo{display:none}}
@media (max-width:1000px){#mid{grid-template-columns:minmax(0,1fr) 260px}.chip{padding:2px 4px;font-size:11px}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <div id="logo">ROGUE 90'</div>
  <div class="chip"><small>КЭШ</small><b id="sCash">$50</b></div>
  <div class="chip"><small>REP</small><b id="sRep">4</b></div>
  <div class="chip"><small>ДИСТ</small><b id="sDist">0м</b></div>
  <div class="chip"><small>БАНДА</small><b id="sSquad">1/2</b></div>
  <div class="chip"><small>РОЗЫСК</small><b id="sStars"></b></div>
  <div class="chip" id="chipT"><small>ВРЕМЯ</small><b id="sTime">0:00</b></div>
  <div class="grow"></div>
  <button class="btn amber" data-act="hireOpen">+ Нанять</button>
  <button class="btn" data-act="bizOpen">Бизнесы</button>
  <button class="btn" id="bSpeed" data-act="speed">1x</button>
  <button class="btn" id="bPause" data-act="pause">Пауза</button>
  <button class="btn" id="bSound" data-act="sound">Звук: вкл</button>
  <button class="btn red" id="bEscape" data-act="escape">Свалить с добычей</button>
 </header>
 <main id="mid">
  <section id="arenaWrap">
   <canvas id="cv" width="480" height="270"></canvas>
   <div id="toast"></div>
   <div id="pauseTag">ПАУЗА</div>
   <div id="overlay"></div>
  </section>
  <aside id="side">
   <div class="sec">
    <h4><span>КАЗИНО «ЗОЛОТАЯ ВИШНЯ»</span><span id="casCost">$15</span></h4>
    <canvas id="slotCv" width="132" height="40"></canvas>
    <div class="row"><button class="btn amber grow" id="spinBtn" data-act="spin">Крутить $15</button></div>
    <div id="casMsg">Три в ряд — джекпот!</div>
   </div>
   <div class="sec">
    <h4><span>ИНВЕНТАРЬ</span><span id="invCnt">0/6</span></h4>
    <div id="inv"></div>
    <div id="itemInfo">Выбери предмет, затем кликни на бойца.</div>
    <div class="row"><button class="btn sm grow" data-act="merge">Слить одинаковые</button><button class="btn sm amber grow" id="buyBtn" data-act="buy">Ларёк $30</button></div>
    <div class="row"><button class="btn sm grow" id="medBtn" data-act="med">Аптечка $25</button><button class="btn sm grow" id="vodkaBtn" data-act="vodka">Водка $30</button></div>
   </div>
   <div class="sec"><h4><span>ВЫБРАННЫЙ БОЕЦ</span><span style="color:var(--dim)">1-5 · A L F Q</span></h4><div id="sel"></div></div>
  </aside>
 </main>
 <footer id="bottom"><div id="cards"></div></footer>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<script>
'use strict';
/* ==================================================================
   ROGUE 90' — single-file prototype
   Systems: Constants/Balance · Utils · Audio · Pixel font · Sprites ·
   Game State · World/Renderer · Combat · AI · Economy · Casino ·
   Inventory · Meta progression · UI · Main loop
   ================================================================== */
const W=480,H=270,CH=260;
const DL=String.fromCharCode(36); // currency sign

/* ---------------- BALANCE (all tunables here) ---------------- */
const BAL={
  START_CASH:50,START_REP:4,BASE_LIMIT:2,
  SPIN_BASE:15,SPIN_STEP:3,SPIN_EVERY:3,
  LOOT_TIME:2.5,
  LOOT:{kiosk:[15,30],video:[20,35],gas:[25,45]},
  ENEMY_LOOT:[3,8],OBJ_LOOT:[5,15],SHOP_REP:[2,4],
  PX_PER_M:14,MARCH:38,GRACE:60,
  UPG:[100,250,550],
  MARKET:30,MARKET_STEP:8,MED:25,VODKA:30,INV:6,
  ARREST_KEEP:[.3,.5,.7,.9],
  LAUNDER:{dist:.5,loot:.25,kill:2},
  VIDEO_LOOT:[0,.15,.30,.50],VIDEO_CASH:[0,25,50,100],
  REST_RARE:[0,.10,.20,.30],REST_REP:[0,1,2,3],
  BAR_POWER:[1,1.3,1.6,2.0],
  STEP:1/60
};
const CLASSES={
  thug:{name:'Шпана',cost:2,hp:70,dmg:9,spd:62,rate:2.2,armor:.05,crit:.08,range:20,knock:70,loot:1.6,dodge:.12,ranged:false,chain:false,desc:'Быстрый ближний бой. Грабит точки в 1.6× быстрее.'},
  bouncer:{name:'Вышибала',cost:4,hp:170,dmg:22,spd:40,rate:.8,armor:.2,crit:.1,range:26,knock:240,loot:1,dodge:.03,ranged:false,chain:false,desc:'Много HP. Медленный, но мощный удар с сильным отбрасыванием.'},
  skater:{name:'Скейтер',cost:3,hp:55,dmg:8,spd:84,rate:1.6,armor:0,crit:.15,range:120,knock:25,loot:1,dodge:.25,ranged:true,chain:false,desc:'Стреляет издалека. Хрупкий, но очень мобильный.'},
  biker:{name:'Байкер',cost:5,hp:110,dmg:14,spd:55,rate:1.2,armor:.1,crit:.12,range:34,knock:110,loot:1,dodge:.08,ranged:false,chain:true,needBar:1,desc:'Цепь бьёт сразу по 3 врагам. Открывается улучшением Бара.'}
};
const ENEMIES={
  punk:{name:'Уличный панк',hp:40,dmg:6,spd:55,rate:1.1,range:18,armor:0,crit:.05,knock:30,kres:0,ranged:false,loot:BAL.ENEMY_LOOT,xp:10},
  brute:{name:'Толстый вышибала',hp:150,dmg:16,spd:32,rate:.7,range:24,armor:.15,crit:.05,knock:120,kres:.6,ranged:false,loot:[5,8],xp:25},
  cop:{name:'Полицейский',hp:85,dmg:11,spd:58,rate:1,range:26,armor:.05,crit:.05,knock:50,kres:.2,ranged:false,loot:[4,8],xp:18},
  swat:{name:'SWAT',hp:220,dmg:14,spd:48,rate:.9,range:150,armor:.3,crit:.08,knock:40,kres:.7,ranged:true,loot:[6,8],xp:40}
};
const SLOTS=['head','weapon','neck','body'];
const SLOTNAME={head:'ГОЛОВА',weapon:'ОРУЖИЕ',neck:'ШЕЯ',body:'ТЕЛО'};
const ITEMS={
  ushanka:{name:'Ушанка',slot:'head',v:[.25,.33,.42]},
  cap:{name:'Кепка',slot:'head',v:[.3,.4,.5]},
  bat:{name:'Бита с гвоздями',slot:'weapon',v:[12,20,30]},
  uzi:{name:'Узи',slot:'weapon',v:[18,28,40]},
  chain:{name:'Золотая цепь',slot:'neck',v:[.5,.75,1]},
  jacket:{name:'Кожанка',slot:'body',v:[45,70,100],regen:[1.5,2.5,4]}
};
const ITEM_IDS=Object.keys(ITEMS);
function itemDesc(id,lv){const v=ITEMS[id].v[lv-1],p=Math.round(v*100);
  switch(id){case 'ushanka':return '+'+p+'% брони';case 'cap':return '+'+p+'% скорости';case 'bat':return '+'+v+' урона';
  case 'uzi':return '+'+v+' урона, дальняя атака';case 'chain':return '+'+p+'% добычи';
  case 'jacket':return '+'+v+' Max HP, реген '+ITEMS.jacket.regen[lv-1]+'/с'}return ''}
const SYMS=['cherry','bar','seven','dollar','bottle','bat'];
const SYM_W=[22,12,10,14,22,20];

/* ---------------- UTILS ---------------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function outline(c,col){
  const g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),d=id.data,o=new Uint8ClampedArray(d);
  const A=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:o[(y*w+x)*4+3];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(o[i+3]===0&&(A(x-1,y)>0||A(x+1,y)>0||A(x,y-1)>0||A(x,y+1)>0)){d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255}}
  g.putImageData(id,0,0);return c}

/* ---------------- AUDIO (Web Audio, fully procedural) ---------------- */
const Snd={ctx:null,out:null,on:true,nb:null,
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=this.on?.55:0;
    const comp=this.ctx.createDynamicsCompressor();this.out.connect(comp);comp.connect(this.ctx.destination);
    const n=(this.ctx.sampleRate*1.6)|0;this.nb=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=this.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;Music.start()}catch(e){this.ctx=null}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  setOn(v){this.on=v;if(this.out)this.out.gain.setTargetAtTime(v?.55:0,this.ctx.currentTime,.02)},
  tone(type,f0,f1,dur,vol=.15,dl=0,dest){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime+dl;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||this.out);o.start(t);o.stop(t+dur+.03)},
  noise(dur,vol,ft,f0,f1,dl=0,dest){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime+dl;
    const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||this.out);s.start(t,Math.random()*.4);s.stop(t+dur+.03)},
  hit(h){this.noise(.09,h?.35:.2,'lowpass',h?1800:1200,300);this.tone('square',h?140:200,50,.1,h?.2:.1)},
  swing(){this.noise(.07,.07,'highpass',2000,4000)},
  shoot(){this.noise(.06,.16,'bandpass',2600,900);this.tone('square',700,150,.07,.08)},
  coin(){this.tone('square',988,988,.06,.06);this.tone('square',1319,1319,.14,.06,.06)},
  tick(){this.tone('square',300+Math.random()*300,200,.03,.04)},
  stop(){this.tone('square',220,170,.08,.09)},
  win(){[523,659,784,1047,1319,1568].forEach((f,i)=>this.tone('square',f,f,.15,.08,i*.09))},
  lose(){this.tone('sawtooth',180,80,.3,.09)},

  Snd.coin();return v}
function rollItem(min){const r=G.run,rb=BAL.REST_RARE[r.biz.restaurant],x=Math.random(),p3=.01+rb*.15,p2=.07+rb;let lv=1;
  if(x<p3)lv=3;else if(x<p3+p2)lv=2;if(min&&lv<min)lv=min;return{id:pick(ITEM_IDS),lv}}
function dropItem(x,y,min){const it=rollItem(min);
  if(addItem(it)){addText(x,y-20,'ITEM!','#9ad0e8',1);toast('ПОЛУЧЕНО: '+ITEMS[it.id].name+' Lv.'+it.lv)}

function addXp(u,v){u.xp+=v;let up=false;
  while(u.lvl<6&&u.xp>=30+u.lvl*25){u.xp-=30+u.lvl*25;u.lvl++;up=true;recalc(u);u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.3)}

function giveXp(att,xp){for(const u of G.run.units){if(!u.dead)addXp(u,u===att?xp:xp*.4)}}
function doDamage(att,t,raw,o){
  o=o||{};if(t.dead||t.state==='down')return 0;
  if(t.team===0&&!o.noDodge&&t.state!=='loot'&&t.state!=='hurt'&&Math.random()<t.s.dodge){
    addText(t.x,t.y-40,'MISS!','#8696ab',1);t.ky=Math.random()<.5?150:-150;t.kx-=(t.face||1)*30;return 0}
  const d=Math.max(1,Math.round(raw*(1-t.s.armor)));t.hp-=d;t.flash=.14;t.combatT=3;
  const crit=!!o.crit,dir=o.dir||(att&&att.x>t.x?-1:1);
  t.kx+=dir*(o.knock||0)*(1-(t.kres||0))*(crit?1.3:1);
  addText(t.x+rnd(-6,6),t.y-38,d,crit?'#f0c050':(t.team===0?'#e0735a':'#f0e8d0'),crit?2:1);
  let kd=false;
  if(t.state!=='loot'&&t.armorT<=0&&(t.kres||0)<.7&&t.hp>0){
    if(d>=t.maxHp*.3||(crit&&Math.random()<.45)||((o.knock||0)>=200&&Math.random()<.5)){kd=true;t.state='down';t.st=.95;t.downT=0;t.armorT=1.4;addText(t.x,t.y-52,'KNOCKDOWN!','#e8dcc0',1);t.kx+=dir*60}
    else if((t.kres||0)<.5){t.state='hurt';t.st=.26;t.armorT=.5}}
  if(crit)addText(t.x,t.y-64,'CRITICAL!','#e0a43a',1);else if(d>=20&&!kd)addText(t.x,t.y-64,'SMASH!','#e0735a',1);
  const heavy=d>=18||crit;Snd.hit(heavy);
  if(heavy){G.hitStop=Math.max(G.hitStop,crit?.09:.06);G.shake=Math.max(G.shake,crit?4:2.5)}
  burst(t.x,t.y,22,heavy?7:4,['#f0e8d0','#e0b440','#c4473a'],110,1,300,.35);
  if(t.hp<=0){t.hp=0;if(t.team===0)killUnit(t);else killEnemy(t,att)}
  return d}

function steer(u,tx,ty,sp,dt){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d<1.5)return d;const m=Math.min(d,sp*dt);

  if(r.cash<cost){toast('Не хватает денег на спин: '+DL+cost);Snd.bad();return}
  r.cash-=cost;r.spins++;Casino.cost=cost;Casino.spinning=true;Casino.t=0;Casino.flash=0;Casino.res=[rollSym(),rollSym(),rollSym()];
  Casino.reels.forEach((re,i)=>{re.stopAt=.9+i*.5;re.stopped=false;re.spd=13+i*2;re.lt=0});setMsg('Крутим...');Snd.tick()}
function casinoUpdate(dt){const C=Casino;if(C.flash>0)C.flash-=dt;if(!C.spinning)return;
  if(G.mode!=='run'){C.spinning=false;return}
  C.t+=dt;let all=true;
  C.reels.forEach((re,i)=>{if(re.stopped)return;all=false;
    if(C.t>=re.stopAt){re.stopped=true;re.pos=C.res[i];Snd.stop()}
    else{re.pos=(re.pos+re.spd*dt)%6;if(i===0){const k=Math.floor(re.pos*2);if(k!==re.lt){re.lt=k;Snd.tick()}}}});

  setMsg('Мимо. −'+DL+cost);Snd.lose()}

function act(a,d){
  switch(a){
    case 'start':Snd.click();startRun();break;
    case 'menu':showMenu();break;
    case 'help':openModal(helpHTML());break;
    case 'reset':if(confirm('Сбросить весь прогресс (бизнесы и отмытые деньги)?')){try{localStorage.removeItem(SAVEKEY)}catch(e){}
      meta={laundered:0,biz:{laundry:0,bar:0,video:0,restaurant:0},bestDist:0,runs:0,sound:meta.sound,total:0};saveMeta();showMenu()}break;
    case 'bizOpen':Snd.click();openBiz();break;
    case 'bizBuy':bizBuy(d.id);break;
    case 'closeModal':closeModal();break;
    case 'hireOpen':if(G.mode==='run'){Snd.click();openHire()}break;
    case 'hire':hire(d.cls);break;
    case 'speed':G.speed=G.speed===1?2:1;Snd.click();break;
    case 'pause':togglePause();Snd.click();break;
    case 'sound':toggleSound();Snd.click();break;
    case 'escape':onEscape();break;
    case 'spin':spin();break;
    case 'inv':if(G.mode==='run')invClick(+d.i);break;
    case 'merge':if(G.mode==='run')mergeAll();break;
    case 'buy':if(G.mode==='run')buyItem();break;
    case 'med':if(G.mode==='run')useMed();break;
    case 'vodka':if(G.mode==='run')useVodka();break;
    case 'card':if(G.mode==='run')selectUnit(+d.id);break;
    case 'unequip':{const r=G.run,u=r.units.find(x=>x.id===r.sel);if(u&&G.mode==='run')unequip(u,d.slot);break}
    case 'cmd':if(G.mode==='run')setCmd(d.c);break}}

function arenaClick(wx,wy){const r=G.run;
  const pickF=list=>{let b=null;for(const o of list){if(o.dead)continue;if(Math.abs(wx-o.x)<=14&&wy>=o.y-46&&wy<=o.y+6&&(!b||o.y>b.y))b=o}return b};
  const u=pickF(r.units);if(u){selectUnit(u.id);return}
  const sel=r.units.find(x=>x.id===r.sel&&!x.dead);if(G.selItem>=0&&!u){G.selItem=-1;return}
  if(!sel)return;
  const e=pickF(r.enemies);if(e){sel.focus=e;sel.cmd='attack';addText(e.x,e.y-70,'TARGET','#c4473a',1);Snd.click();return}
  for(const o of r.props){if(o.kind!=='obj'||o.broken)continue;const car=o.type==='car';
    if(Math.abs(wx-o.x)<=(car?34:12)&&wy>=o.y-(car?30:46)&&wy<=o.y+5){sel.focusObj=o;sel.focus=null;sel.cmd='auto';addText(o.x,o.y-50,'SMASH?','#e0a43a',1);Snd.click();return}}
  for(const p of r.props){if(p.kind!=='shop'||p.looted)continue;
    if(Math.abs(wx-p.x)<=44&&wy>=44&&wy<=152){sel.cmd='loot';sel.cmdProp=p;sel.focus=null;sel.focusObj=null;addText(p.x,100,'LOOT','#e0a43a',1);Snd.click();return}}}

  if(e.code==='Escape'&&G.modal&&G.mode==='run'){closeModal();return}
  if(G.mode!=='run'||G.modal)return;
  const c=e.code;
  if(c==='Space'){e.preventDefault();togglePause();return}
  if(c==='KeyM'){toggleSound();return}
  if(/^Digit[1-5]$/.test(c)){const u=aliveUnits()[+c.slice(5)-1];if(u)selectUnit(u.id);return}
  if(c==='KeyA')setCmd('attack');else if(c==='KeyL')setCmd('loot');else if(c==='KeyF')setCmd('follow');else if(c==='KeyQ')setCmd('auto')});

/* ==================== MAIN LOOP ==================== */
let lastT=0,acc=0;
function frame(ts){requestAnimationFrame(frame);
  const real=Math.min(.1,Math.max(0,(ts-lastT)/1000)||0);lastT=ts;G.t+=real;G.shake=Math.max(0,G.shake-real*18);
  if(G.escArm>0)G.escArm=Math.max(0,G.escArm-real);
  const frozen=G.paused||G.modal;
  if(G.mode==='run'&&!frozen){acc+=real*G.speed;let n=0;while(acc>=BAL.STEP&&n<12&&G.mode==='run'){stepRun(BAL.STEP);acc-=BAL.STEP;n++}if(n>=12)acc=0}
  else if(G.mode==='menu')demoStep(real);
  else if(G.mode==='results')updateFx(real);
  casinoUpdate(real);render();UI.tick();drawCasino()}

/* ==================== INIT ==================== */
loadMeta();Snd.on=meta.sound;initArt();fit();showMenu();requestAnimationFrame(frame);
</script>
